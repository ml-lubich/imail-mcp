[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imail-mcp"
version = "0.2.0"
description = "Agent-friendly Apple Mail.app CLI (imail): list, send, and auto-organize mail via AppleScript — no IMAP, no mail server config."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ml-lubich" }]
keywords = ["apple-mail", "macos", "mail.app", "cli", "agent", "mcp", "typer", "applescript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12",
  "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/imail-mcp"
Repository = "https://github.com/ml-lubich/imail-mcp"
Issues = "https://github.com/ml-lubich/imail-mcp/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "hypothesis>=6.100",
]

[project.scripts]
imail = "imail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/imail"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/imail",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=imail --cov-report=term-missing --cov-fail-under=90"
