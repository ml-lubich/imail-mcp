[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imail-mcp"
version = "0.1.1"
description = "imail-mcp — Apple Mail CLI (imail) + MCP-friendly agent schema. Typer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ml-lubich" }]
keywords = ["apple-mail", "macos", "cli", "agent", "typer", "mail"]
dependencies = [
  "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/ml-lubich/imail"
Repository = "https://github.com/ml-lubich/imail"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=6.0",
]

[project.scripts]
imail = "imail.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/imail"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/imail",
  "/accounts.json",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=imail --cov-report=term-missing --cov-fail-under=90"
